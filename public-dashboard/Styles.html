<style>
  :root{--bg:#f3f3f1;--ink:#0b0b0b;--muted:#70706e;--line:#d3d3cf;--line-dark:#a8a8a3;--soft:#e7e7e2;--green:#25ad67;--white:#fff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;min-height:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  body{overflow:hidden}
  button,select{font:inherit;color:inherit}
  button{cursor:pointer}
  button:disabled,select:disabled{cursor:wait;opacity:.58}
  button:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .app-shell{height:100vh;min-height:0;display:grid;grid-template-columns:230px 1fr;overflow:hidden}
  .sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line-dark);padding:34px 28px 24px;display:flex;flex-direction:column;background:var(--bg)}
  .brand{font-weight:780;font-size:25px;line-height:.92;letter-spacing:-.055em}
  .brand-sub{font-size:12px;color:var(--muted);margin-top:12px}
  nav{display:grid;margin:44px -28px 0}
  .nav-item{text-align:left;border:0;border-top:1px solid var(--line);background:transparent;padding:18px 28px;font-weight:590;font-size:14px}
  .nav-item:last-child{border-bottom:1px solid var(--line)}
  .nav-item.active{font-weight:760;background:rgba(255,255,255,.18)}
  .nav-item.active:before{content:"→";margin-right:10px}
  .nav-item:disabled{opacity:.3;cursor:default}
  .sidebar-bottom{margin-top:auto}
  .source-title,.eyebrow,.section-label,.kpi>span,.op-card>span{font-size:10px;font-weight:800;letter-spacing:.14em}
  .sync-mini{display:flex;align-items:flex-start;gap:10px;padding:14px 0 16px;border-bottom:1px solid var(--line)}
  .sync-mini .sync-dot{margin-top:4px}.sync-mini strong{display:block;font-size:11px}.sync-mini span:not(.sync-dot){display:block;color:var(--muted);font-size:10px;margin-top:3px}
  .mode-switch{display:grid;grid-template-columns:1fr 1fr;margin-top:16px;border:1px solid var(--line-dark)}
  .mode-switch button{border:0;background:transparent;padding:9px 6px;font-size:11px}.mode-switch button.active{background:var(--ink);color:#fff}.mode-switch button:disabled{cursor:default}
  .mode-note{font-size:10px;color:var(--muted);line-height:1.45;margin:13px 0 0}
  .version{font-size:10px;color:var(--muted);margin-top:14px}
  .main{padding:30px 36px 28px;max-width:1700px;width:100%;height:100vh;min-height:0;margin:0 auto;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;padding-bottom:24px;border-bottom:1px solid var(--line-dark);gap:28px}
  h1{font-size:52px;line-height:.95;margin:7px 0 0;letter-spacing:-.06em;font-weight:760}
  .subtitle{font-size:14px;color:var(--muted);margin:10px 0 0}
  .controls{display:flex;gap:10px;align-items:center;padding-top:5px;flex-wrap:wrap}
  .mobile-mode-switch{display:none;border:1px solid var(--line-dark)}
  .mobile-mode-switch button{border:0;background:transparent;padding:10px 12px;font-size:11px}
  .mobile-mode-switch button.active{background:var(--ink);color:#fff}
  select{border:1px solid var(--line-dark);background:transparent;padding:10px 34px 10px 12px;border-radius:0;font-size:12px;font-weight:650;min-width:158px}
  .sync-box{border:1px solid var(--line);padding:10px 12px;font-size:10px;display:flex;align-items:center;gap:7px;min-width:180px;white-space:nowrap}
  .sync-dot{width:7px;height:7px;background:var(--green);border-radius:50%;display:inline-block;flex:0 0 auto}
  .sync-dot.warn{background:var(--ink);opacity:.45!important}
  .sync-box.warn{border-style:dashed}
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);border-left:1px solid var(--line);border-bottom:1px solid var(--line-dark)}
  .kpi{padding:20px 18px 16px;border-right:1px solid var(--line);min-height:158px;overflow:hidden}
  .kpi-body{display:flex;flex-direction:column;align-items:stretch;gap:0;margin-top:14px;min-width:0}
  .kpi strong{display:block;font-size:clamp(28px,2.15vw,34px);letter-spacing:-.05em;white-space:nowrap;line-height:1;max-width:100%;overflow:hidden;text-overflow:clip}
  .kpi small{display:block;font-size:10px;color:var(--muted);margin-top:10px;white-space:nowrap}
  .sparkline{height:34px;width:100%;margin-top:8px;overflow:hidden}.sparkline svg{width:100%;height:100%;overflow:hidden;display:block}
  .delta-up,.delta-down{color:var(--ink)!important}
  .mid-grid{display:grid;grid-template-columns:minmax(390px,.82fr) minmax(0,1.72fr);border-bottom:1px solid var(--line-dark)}
  .target-card,.sales-card{padding:24px 0;min-height:350px}
  .target-card{padding-right:28px;border-right:1px solid var(--line-dark);display:flex;flex-direction:column}
  .sales-card{padding-left:30px}
  .section-head,.panel-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
  .target-head{align-items:center}
  .target-edit-button{border:1px solid var(--line-dark);background:transparent;padding:7px 10px;font-size:10px;font-weight:650;line-height:1;transition:background .15s ease,color .15s ease}
  .target-edit-button:hover{background:var(--ink);color:#fff}
  .target-content{display:grid;grid-template-columns:154px minmax(0,1fr);gap:28px;align-items:center;flex:1;padding:18px 0 20px}
  .target-ring{--progress:0deg;width:154px;height:154px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ink) var(--progress),var(--soft) 0);position:relative}
  .target-ring:after{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--bg)}
  .target-ring-center{position:relative;z-index:1;text-align:center}
  .target-ring-center strong{display:block;font-size:40px;line-height:.95;letter-spacing:-.06em}
  .target-ring-center span{display:block;font-size:10px;color:var(--muted);margin-top:8px}
  .target-info{align-self:stretch;display:flex;flex-direction:column;justify-content:center;min-width:0}
  .target-info h2,.panel h2,.sales-card h2{font-size:17px;margin:7px 0 0;letter-spacing:-.025em}
  .target-info h2{font-size:22px;line-height:1.02;letter-spacing:-.04em;margin:0 0 9px}
  .target-info p{font-size:12px;color:var(--muted);line-height:1.45;margin:0;max-width:330px}
  .target-progress-block{margin-top:24px}
  .target-track{height:12px;background:var(--soft);position:relative;overflow:hidden}
  .target-bar{height:100%;width:0;background:var(--ink);transition:width .35s ease}
  .target-completion{display:block;font-size:9px;color:var(--muted);margin-top:8px}
  .target-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line-dark);margin-top:auto}
  .target-stats>div{padding:14px 12px 0 0;min-width:0}
  .target-stats>div+div{border-left:1px solid var(--line);padding-left:16px}
  .target-stats span{display:block;font-size:8.5px;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.08em}
  .target-stats strong{display:block;font-size:13px;line-height:1.15;white-space:nowrap;letter-spacing:-.02em}
  .legend{display:flex;gap:14px;font-size:9px;color:var(--muted);padding-top:4px}.legend span{display:flex;align-items:center;gap:6px}.line{display:block;width:20px;height:2px;background:var(--ink)}.line.previous{height:0;border-top:2px dashed #999;background:transparent}
  .range-dates{display:block;color:var(--muted);font-size:9px;margin-top:5px}
  .chart{height:230px;margin-top:14px;position:relative}.chart svg{width:100%;height:100%;overflow:visible}.chart-empty{height:100%;display:grid;place-items:center;color:var(--muted);font-size:11px}
  .axis-label{font-size:8.5px;fill:#777}.grid-line{stroke:var(--line);stroke-width:1}.zero-line{stroke:var(--line-dark);stroke-width:1}
  .bottom-grid{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line-dark)}
  .panel{padding:22px 0;min-height:290px}.top-products{padding-right:30px;border-right:1px solid var(--line-dark)}.operations-panel{padding-left:30px}
  .panel-note{font-size:9px;color:var(--muted)}
  .product-list{margin-top:15px;border-top:1px solid var(--line)}
  .product-row{display:grid;grid-template-columns:28px minmax(0,1fr) 92px;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
  .rank{font-size:10px;color:var(--muted)}.product-name{font-weight:620;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.product-meta{text-align:right}.product-meta strong{display:block;font-size:11px}.product-meta small{font-size:9px;color:var(--muted)}
  .product-bar{grid-column:2/4;height:4px;background:var(--soft);margin-top:-3px}.product-bar i{display:block;height:100%;background:var(--ink)}
  .operations-grid{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--line);margin-top:15px}
  .op-card{padding:17px 15px 18px 0;border-bottom:1px solid var(--line);min-height:108px}.op-card:nth-child(odd){border-right:1px solid var(--line);padding-right:22px}.op-card:nth-child(even){padding-left:22px}.op-card strong{display:block;font-size:30px;margin-top:12px;letter-spacing:-.04em}.op-card small{font-size:9px;color:var(--muted);display:block;margin-top:5px}
  footer{padding-top:14px;font-size:9px;color:var(--muted);display:flex;justify-content:space-between;letter-spacing:.03em}
  .chart-tooltip{position:fixed;z-index:20;background:#111;color:#fff;padding:9px 11px;font-size:10px;line-height:1.45;pointer-events:none;box-shadow:0 5px 20px rgba(0,0,0,.15);min-width:150px}
  .chart-tooltip strong{display:block;margin-bottom:3px}.chart-tooltip span{display:block;color:#d8d8d8}
  .error-toast{position:fixed;right:18px;bottom:18px;max-width:440px;background:#111;color:#fff;padding:12px 12px 12px 15px;font-size:11px;z-index:40;display:flex;align-items:center;gap:14px;box-shadow:0 8px 30px rgba(0,0,0,.16)}
  .error-toast span{line-height:1.4}
  .error-toast button{margin-left:auto;border:1px solid #666;background:transparent;color:#fff;padding:7px 9px;font-size:10px;white-space:nowrap}
  .error-toast button:hover{background:#fff;color:#111}
  .load-bar{position:fixed;left:0;top:0;height:2px;width:100%;z-index:60;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .15s ease}
  .load-bar:before{content:"";position:absolute;top:0;bottom:0;width:35%;background:var(--ink);transform:translateX(-120%)}
  body.loading .load-bar{opacity:1}
  body.loading .load-bar:before{animation:cc-loading 1.05s ease-in-out infinite}
  @keyframes cc-loading{0%{transform:translateX(-120%)}100%{transform:translateX(390%)}}
  @media(max-width:1080px){.app-shell{grid-template-columns:185px 1fr}.sidebar{padding-left:20px;padding-right:20px}.nav-item{padding-left:20px;padding-right:20px}.mid-grid,.bottom-grid{grid-template-columns:1fr}.target-card,.top-products{border-right:0;border-bottom:1px solid var(--line-dark);padding-right:0}.sales-card,.operations-panel{padding-left:0}.sparkline{height:30px}.target-card{min-height:330px}}
  @media(max-width:820px){.app-shell{grid-template-columns:1fr}.sidebar{display:none}.main{padding:22px}.topbar{flex-direction:column}.controls{width:100%;align-items:stretch}.mobile-mode-switch{display:grid;grid-template-columns:1fr 1fr}.kpi-grid{grid-template-columns:repeat(2,1fr)}.target-content{grid-template-columns:140px 1fr}.target-ring{width:136px;height:136px}.target-ring-center strong{font-size:34px}h1{font-size:44px}}
  @media(max-width:560px){.main{padding:15px}.error-toast{left:12px;right:12px;bottom:12px;max-width:none}.kpi-grid{grid-template-columns:1fr}.target-content{grid-template-columns:1fr}.target-ring{margin:auto}.target-info{text-align:center}.target-info p{margin-left:auto;margin-right:auto}.operations-grid{grid-template-columns:1fr}.op-card:nth-child(odd){border-right:0}.op-card:nth-child(even){padding-left:0}.legend{display:none}.target-stats{grid-template-columns:1fr}.target-stats>div+div{border-left:0;border-top:1px solid var(--line);padding-left:0}.controls{flex-direction:column}}
  .mode-switch button{transition:background .15s ease,color .15s ease}
  .mode-switch button:not(.active):hover{background:rgba(0,0,0,.045)}
  [hidden]{display:none!important}
  .portfolio-mode .kpi strong,.portfolio-mode .op-card strong{letter-spacing:.02em}
  .portfolio-mode .product-meta strong{font-variant-numeric:tabular-nums}


  /* M7.5 — Navigation + Sales view */
  .nav-item:not(:disabled):hover{background:rgba(255,255,255,.12)}
  .dashboard-view{min-width:0}
  .mobile-section-nav{display:none}

  .sales-summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-left:1px solid var(--line);border-bottom:1px solid var(--line-dark)}
  .sales-summary-card{padding:22px 18px 18px;border-right:1px solid var(--line);min-height:145px;display:flex;flex-direction:column;min-width:0}
  .sales-summary-card>span{font-size:10px;font-weight:800;letter-spacing:.14em}
  .sales-summary-card>strong{font-size:clamp(28px,2.35vw,38px);line-height:1;letter-spacing:-.055em;margin-top:22px;white-space:nowrap;overflow:hidden}
  .sales-summary-card>small{font-size:10px;color:var(--muted);margin-top:9px;white-space:nowrap}
  .sales-target-track{height:5px;background:var(--soft);margin-top:auto;overflow:hidden}
  .sales-target-track i{display:block;height:100%;background:var(--ink);width:0;transition:width .3s ease}

  .sales-focus-grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(280px,.72fr);border-bottom:1px solid var(--line-dark)}
  .sales-deep-chart-panel{padding:26px 30px 24px 0;border-right:1px solid var(--line-dark);min-height:370px}
  .sales-comparison-panel{padding:26px 0 24px 30px;min-height:370px}
  .sales-deep-chart{height:285px;margin-top:18px}
  .comparison-badge{border:1px solid var(--line-dark);padding:6px 8px;font-size:9px;font-weight:750;white-space:nowrap}
  .comparison-list{margin-top:22px;border-top:1px solid var(--line)}
  .comparison-list>div{display:flex;align-items:end;justify-content:space-between;gap:18px;padding:17px 0;border-bottom:1px solid var(--line)}
  .comparison-list span{font-size:10px;color:var(--muted)}
  .comparison-list strong{font-size:15px;letter-spacing:-.025em;text-align:right}

  .sales-insight-grid{display:grid;grid-template-columns:1.08fr .92fr;border-bottom:1px solid var(--line-dark)}
  .sales-highlights-panel{padding:24px 30px 24px 0;border-right:1px solid var(--line-dark);min-height:300px}
  .sales-rhythm-panel{padding:24px 0 24px 30px;min-height:300px}
  .highlight-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);margin-top:18px}
  .highlight-card{padding:20px 16px 20px 0;min-width:0}
  .highlight-card+ .highlight-card{border-left:1px solid var(--line);padding-left:18px}
  .highlight-card>span{font-size:8.5px;font-weight:800;letter-spacing:.1em;color:var(--muted);display:block;line-height:1.35}
  .highlight-card>strong{display:block;font-size:22px;letter-spacing:-.04em;margin-top:18px}
  .highlight-card>small{display:block;font-size:9px;color:var(--muted);margin-top:8px;line-height:1.4}

  .sales-rhythm-list{margin-top:18px;border-top:1px solid var(--line)}
  .rhythm-row{display:grid;grid-template-columns:50px minmax(80px,1fr) 82px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .rhythm-date{font-size:9px;color:var(--muted)}
  .rhythm-track{height:5px;background:var(--soft);overflow:hidden}
  .rhythm-track i{display:block;height:100%;background:var(--ink)}
  .rhythm-value{font-size:10px;text-align:right;white-space:nowrap}

  @media(max-width:1080px){
    .sales-focus-grid,.sales-insight-grid{grid-template-columns:1fr}
    .sales-deep-chart-panel,.sales-highlights-panel{border-right:0;border-bottom:1px solid var(--line-dark);padding-right:0}
    .sales-comparison-panel,.sales-rhythm-panel{padding-left:0}
    .sales-summary-grid{grid-template-columns:repeat(2,1fr)}
  }
  @media(max-width:820px){
    .mobile-section-nav{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line-dark);margin-top:-1px}
    .mobile-section-nav button{border:0;border-right:1px solid var(--line);background:transparent;padding:12px 10px;font-size:11px;font-weight:650}
    .mobile-section-nav button:last-child{border-right:0}
    .mobile-section-nav button.active{background:var(--ink);color:#fff}
    .sales-summary-grid{grid-template-columns:repeat(2,1fr)}
    .sales-deep-chart{height:250px}
  }
  @media(max-width:560px){
    .sales-summary-grid{grid-template-columns:1fr}
    .highlight-grid{grid-template-columns:1fr}
    .highlight-card+ .highlight-card{border-left:0;border-top:1px solid var(--line);padding-left:0}
    .sales-deep-chart{height:230px}
    .rhythm-row{grid-template-columns:44px minmax(60px,1fr) 64px;gap:8px}
  }

  /* M7.5 v2 — Products, Inventory & Operations */
  .section-summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-left:1px solid var(--line);border-bottom:1px solid var(--line-dark)}
  .section-summary-card{padding:22px 18px 18px;border-right:1px solid var(--line);min-height:145px;display:flex;flex-direction:column;min-width:0}
  .section-summary-card>span{font-size:10px;font-weight:800;letter-spacing:.14em}
  .section-summary-card>strong{font-size:clamp(28px,2.35vw,38px);line-height:1;letter-spacing:-.055em;margin-top:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .section-summary-card>strong.summary-text-value{font-size:clamp(20px,1.75vw,28px);letter-spacing:-.04em;line-height:1.05}
  .section-summary-card>small{font-size:10px;color:var(--muted);margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .dual-view-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);border-bottom:1px solid var(--line-dark)}
  .view-panel-left{padding:26px 30px 26px 0;border-right:1px solid var(--line-dark);min-height:390px}
  .view-panel-right{padding:26px 0 26px 30px;min-height:390px}
  .wide-panel-row{border-bottom:1px solid var(--line-dark)}
  .wide-panel{padding:24px 0;min-height:245px}

  .rank-list,.signal-list,.exception-list{margin-top:18px;border-top:1px solid var(--line)}
  .rank-row{display:grid;grid-template-columns:30px minmax(0,1fr) 88px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
  .rank-no{font-size:9px;color:var(--muted)}
  .rank-copy{min-width:0}.rank-copy>strong{font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rank-copy>small{font-size:9px;color:var(--muted);display:block;margin-top:4px}
  .rank-value{font-size:10px;font-weight:700;text-align:right;white-space:nowrap}
  .rank-track{height:4px;background:var(--soft);overflow:hidden;margin-top:8px}.rank-track i{display:block;height:100%;background:var(--ink)}

  .signal-row{padding:13px 0;border-bottom:1px solid var(--line)}
  .signal-top{display:flex;align-items:center;justify-content:space-between;gap:16px}.signal-top strong{font-size:11px}.signal-top span{font-size:10px;font-weight:700;white-space:nowrap}
  .signal-track{height:5px;background:var(--soft);overflow:hidden;margin-top:9px}.signal-track i{display:block;height:100%;background:var(--ink)}
  .signal-row>small{display:block;font-size:9px;color:var(--muted);margin-top:7px}

  .insight-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);margin-top:18px}
  .insight-cards.four{grid-template-columns:repeat(4,minmax(0,1fr))}
  .insight-card{padding:20px 18px 18px 0;min-width:0}.insight-card+.insight-card{border-left:1px solid var(--line);padding-left:20px}
  .insight-card>span{display:block;font-size:8.5px;font-weight:800;letter-spacing:.1em;color:var(--muted);line-height:1.35}
  .insight-card>strong{display:block;font-size:24px;letter-spacing:-.04em;margin-top:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .insight-card>small{display:block;font-size:9px;color:var(--muted);line-height:1.4;margin-top:7px}

  .operations-signal-grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-top:20px}
  .operations-signal-grid>div{padding:22px 18px 20px 0;min-height:150px}.operations-signal-grid>div+div{border-left:1px solid var(--line);padding-left:20px}
  .operations-signal-grid span,.snapshot-list span{display:block;font-size:8.5px;font-weight:800;letter-spacing:.1em;color:var(--muted)}
  .operations-signal-grid strong{display:block;font-size:30px;letter-spacing:-.04em;margin-top:18px}.operations-signal-grid small{display:block;font-size:9px;color:var(--muted);margin-top:8px}
  .operations-lower-grid .view-panel-left,.operations-lower-grid .view-panel-right{min-height:310px}
  .exception-row{display:grid;grid-template-columns:58px minmax(80px,1fr) 65px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .exception-row>span{font-size:9px;color:var(--muted)}.exception-row>strong{font-size:10px;text-align:right}
