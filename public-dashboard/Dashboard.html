<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const state = { range: 'month', mode: 'portfolio', view: 'overview', data: null, requestId: 0, slowTimer: null };
  const GA_MEASUREMENT_ID = 'G-41S91JE8RZ';
  const analytics = { resolved: false, enabled: false, pending: [] };
  const analyticsSections = ['overview', 'sales', 'products', 'inventory', 'operations'];
  const analyticsRanges = ['month', '7d', '30d', 'ytd'];

  function readOwnerFlag(){
    try{ return localStorage.getItem('cc_owner') === 'true'; }
    catch(err){ return false; }
  }

  function resolveOwnerFlag(location){
    const parameters=location && location.parameter ? location.parameter : {};
    const rawOwner=Array.isArray(parameters.owner) ? parameters.owner[0] : parameters.owner;
    const owner=rawOwner===undefined || rawOwner===null ? '' : String(rawOwner);

    try{
      if(owner==='1') localStorage.setItem('cc_owner','true');
      if(owner==='0') localStorage.removeItem('cc_owner');
    }catch(err){
      // If storage is unavailable, the explicit owner parameter still applies to this page view.
    }

    if(owner==='1') return true;
    if(owner==='0') return false;
    return readOwnerFlag();
  }

  function sendAnalyticsEvent(name,params){
    let safeParams={};
    if(name==='section_view'){
      const section=String(params && params.section_name || '');
      if(analyticsSections.indexOf(section)<0)return;
      safeParams={section_name:section};
    }else if(name==='range_change'){
      const range=String(params && params.range_name || '');
      if(analyticsRanges.indexOf(range)<0)return;
      safeParams={range_name:range};
    }else{
      return;
    }

    if(!analytics.resolved){
      analytics.pending.push({name:name,params:safeParams});
      return;
    }
    if(!analytics.enabled || typeof window.gtag!=='function')return;
    window.gtag('event',name,safeParams);
  }

  function enableAnalytics(){
    analytics.enabled=true;
    window.dataLayer=window.dataLayer||[];
    window.gtag=function(){ window.dataLayer.push(arguments); };
    window.gtag('js',new Date());
    window.gtag('config',GA_MEASUREMENT_ID);

    try{
      if(sessionStorage.getItem('cc_demo_session_started')!=='true'){
        window.gtag('event','demo_session_start');
        sessionStorage.setItem('cc_demo_session_started','true');
      }
    }catch(err){
      // Storage restrictions should not prevent the public page view from being measured.
    }

    const queued=analytics.pending.splice(0);
    if(!queued.some(event=>event.name==='section_view')){
      window.gtag('event','section_view',{section_name:state.view});
    }
    queued.forEach(event=>window.gtag('event',event.name,event.params));

    const script=document.createElement('script');
    script.async=true;
    script.src='https://www.googletagmanager.com/gtag/js?id='+encodeURIComponent(GA_MEASUREMENT_ID);
    document.head.appendChild(script);
  }

  function initializeAnalytics(){
    try{
      google.script.url.getLocation(function(location){
        const isOwner=resolveOwnerFlag(location);
        analytics.resolved=true;
        if(isOwner){
          analytics.pending.length=0;
          return;
        }
        enableAnalytics();
      });
    }catch(err){
      // Fail closed: never load analytics unless owner exclusion has been resolved.
      analytics.resolved=true;
      analytics.pending.length=0;
    }
  }

  function money(v){ return new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0}).format(Number(v||0)); }
  function num(v){ return new Intl.NumberFormat('es-MX',{maximumFractionDigits:0}).format(Number(v||0)); }
  function pct(v,digits=2){ return new Intl.NumberFormat('es-MX',{style:'percent',minimumFractionDigits:digits,maximumFractionDigits:digits}).format(Number(v||0)); }
  function signedPercent(v){ if(v===null || v===undefined || !isFinite(v)) return 'Sin comparación'; const sign=v>0?'▲ ':v<0?'▼ ':''; return sign+pct(Math.abs(v),1)+' vs previous'; }
  function signedPP(v){ if(v===null || v===undefined || !isFinite(v)) return 'Sin comparación'; const n=Number(v)*100; const sign=n>0?'▲ ':n<0?'▼ ':''; return sign+Math.abs(n).toFixed(2)+' pp vs previous'; }
  function signedCount(current,previous){
    const c=Number(current||0),p=Number(previous||0);
    if(!p) return c===0?'Sin cambios':'Sin comparación';
    return signedPercent((c-p)/Math.abs(p));
  }
  function shortDate(iso){ if(!iso)return 'Sin sincronización'; const d=new Date(iso); if(isNaN(d))return iso; return new Intl.DateTimeFormat('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}).format(d); }
  function labelDate(key){ const d=new Date(key+'T00:00:00Z'); return new Intl.DateTimeFormat('es-MX',{day:'numeric',month:'short',timeZone:'UTC'}).format(d); }
  function fullDateRange(start,end){ return labelDate(start)+' – '+labelDate(end); }
  function compactMoney(v){
    const n=Number(v||0),a=Math.abs(n);
    if(a>=1000000)return (n/1000000).toFixed(a>=10000000?0:1)+'M';
    if(a>=1000)return (n/1000).toFixed(a>=100000?0:1)+'K';
    return Math.round(n).toString();
  }

  function modeButtons(){
    return [$('realModeBtn'),$('portfolioModeBtn'),$('realModeBtnMobile'),$('portfolioModeBtnMobile')].filter(Boolean);
  }

  function setLoading(on){
    document.body.classList.toggle('loading',on);
    $('mainContent').setAttribute('aria-busy',on?'true':'false');
    $('rangeSelect').disabled=on;
    modeButtons().forEach(btn=>{btn.disabled=on;});
    if($('editTargetBtn')) $('editTargetBtn').disabled=on;
    if(!on && state.slowTimer){ clearTimeout(state.slowTimer); state.slowTimer=null; }
  }

  function showError(msg,retryable=true){
    const el=$('errorToast');
    $('errorToastText').textContent=msg;
    $('retryBtn').hidden=!retryable;
    el.hidden=false;
  }

  function hideError(){ $('errorToast').hidden=true; }

  function setViewUi(){
    const views={
      overview:{eyebrow:'OVERVIEW',title:'Overview',real:'A real-time view of your e-commerce business.',portfolio:'A privacy-safe view of real e-commerce performance.'},
      sales:{eyebrow:'SALES',title:'Sales',real:'A deeper view of revenue, orders and commercial momentum.',portfolio:'A privacy-safe deep dive into relative sales performance.'},
      products:{eyebrow:'PRODUCTS',title:'Products',real:'Understand product performance, category momentum and catalog structure.',portfolio:'A privacy-safe view of anonymized product performance and relative momentum.'},
      inventory:{eyebrow:'INVENTORY',title:'Inventory',real:'Monitor stock health, availability and inventory attention signals.',portfolio:'A privacy-safe view of stock health and relative inventory attention.'},
      operations:{eyebrow:'OPERATIONS',title:'Operations',real:'Track fulfillment, exceptions and current operational workload.',portfolio:'A privacy-safe view of operational health and relative exception signals.'}
    };
    const current=views[state.view]||views.overview;
    const viewIds={overview:'overviewView',sales:'salesView',products:'productsView',inventory:'inventoryView',operations:'operationsDetailView'};
    Object.keys(viewIds).forEach(key=>{ const el=$(viewIds[key]); if(el) el.hidden=key!==state.view; });
    const navIds={overview:['navOverview','mobileNavOverview'],sales:['navSales','mobileNavSales'],products:['navProducts','mobileNavProducts'],inventory:['navInventory','mobileNavInventory'],operations:['navOperations','mobileNavOperations']};
    Object.keys(navIds).forEach(key=>navIds[key].forEach(id=>{ const btn=$(id); if(btn) btn.classList.toggle('active',key===state.view); }));
    $('pageEyebrow').textContent=current.eyebrow;
    $('pageTitle').textContent=current.title;
    $('dashboardSubtitle').textContent=state.mode==='portfolio'?current.portfolio:current.real;
  }

  function setModeUi(){
    const isPortfolio=state.mode==='portfolio';
    [$('realModeBtn'),$('realModeBtnMobile')].filter(Boolean).forEach(btn=>{
      btn.classList.toggle('active',!isPortfolio);
      btn.setAttribute('aria-pressed',String(!isPortfolio));
    });
    [$('portfolioModeBtn'),$('portfolioModeBtnMobile')].filter(Boolean).forEach(btn=>{
      btn.classList.toggle('active',isPortfolio);
      btn.setAttribute('aria-pressed',String(isPortfolio));
    });
    $('modeNote').textContent='Sanitized operational data · no raw commercial values.';
    document.body.classList.toggle('portfolio-mode',isPortfolio);
    setViewUi();
  }

  function load(){
    setModeUi();
    hideError();
    setLoading(true);
    const requestId=++state.requestId;

    state.slowTimer=setTimeout(()=>{
      if(requestId===state.requestId && document.body.classList.contains('loading')){
        showError('La carga está tardando más de lo normal. Puedes esperar o reintentar.',true);
      }
    },15000);

    const runner=google.script.run
      .withSuccessHandler(data=>{
        if(requestId!==state.requestId)return;
        try{
          state.data=data;
          render(data);
          setLoading(false);
          hideError();
        }catch(err){
          setLoading(false);
          showError('No se pudo renderizar el dashboard: '+(err && err.message ? err.message : String(err)),true);
        }
      })
      .withFailureHandler(err=>{
        if(requestId!==state.requestId)return;
        setLoading(false);
        showError(err && err.message ? err.message : String(err),true);
      });

    runner.getPublicPortfolioData(state.range);
  }

  function applySyncHealth(sync){
    const last=sync && sync.lastSuccessfulSync ? new Date(sync.lastSuccessfulSync) : null;
    const ageMinutes=last && !isNaN(last.getTime()) ? Math.max(0,(Date.now()-last.getTime())/60000) : null;
    const delayed=ageMinutes===null || ageMinutes>150 || String(sync && sync.status || '').toUpperCase()!=='OK';
    $('syncDot').classList.toggle('warn',delayed);
    $('sideSyncDot').classList.toggle('warn',delayed);
    $('syncBox').classList.toggle('warn',delayed);
    return delayed;
  }

  function render(data){
    const isPortfolio=data.mode==='PORTFOLIO';
    $('rangeLabel').textContent=data.range.label;
    $('rangeDates').textContent=fullDateRange(data.range.start,data.range.end)+(isPortfolio?' · relative trend':'');
    $('opsRangeLabel').textContent=data.range.label;

    if(isPortfolio){
      $('netSales').textContent=data.kpis.netSales.display;
      $('orders').textContent=data.kpis.orders.display;
      $('aov').textContent=data.kpis.aov.display;
      $('conversion').textContent=data.kpis.conversion.display;

      $('netSalesDelta').textContent=signedPercent(data.kpis.netSales.delta);
      $('ordersDelta').textContent=signedPercent(data.kpis.orders.delta);
      $('aovDelta').textContent=signedPercent(data.kpis.aov.delta);
      $('conversionDelta').textContent=signedPP(data.kpis.conversion.delta);

      renderSparkline('sparkNetSales',data.kpis.netSales.sparkline);
      renderSparkline('sparkOrders',data.kpis.orders.sparkline);
      renderSparkline('sparkAov',data.kpis.aov.sparkline);
      renderSparkline('sparkConversion',data.kpis.conversion.sparkline);
    }else{
      $('netSales').textContent=money(data.kpis.netSales.value);
      $('orders').textContent=num(data.kpis.orders.value);
      $('aov').textContent=money(data.kpis.aov.value);
      $('conversion').textContent=pct(data.kpis.conversion.value,2);

      $('netSalesDelta').textContent=signedPercent(data.kpis.netSales.delta);
      $('ordersDelta').textContent=signedPercent(data.kpis.orders.delta);
      $('aovDelta').textContent=signedPercent(data.kpis.aov.delta);
      $('conversionDelta').textContent=signedPP(data.kpis.conversion.delta);

      renderSparkline('sparkNetSales',data.salesPerformance.current.map(r=>r.netSales));
      renderSparkline('sparkOrders',data.salesPerformance.current.map(r=>r.orders));
      renderSparkline('sparkAov',data.salesPerformance.current.map(r=>r.aov));
      renderSparkline('sparkConversion',data.salesPerformance.current.map(r=>r.conversion));
    }

    renderTarget(data.target,isPortfolio);
    renderOperations(data.operations,isPortfolio);

    const delayed=applySyncHealth(data.sync);
    const syncPrefix=delayed?'Sync delayed':'Sync';
    const syncCopy=syncPrefix+' '+shortDate(data.sync.lastSuccessfulSync)+' · '+num(data.sync.durationSeconds)+'s';
    $('syncText').textContent=syncCopy;
    $('sideSyncText').textContent=shortDate(data.sync.lastSuccessfulSync)+' · '+num(data.sync.durationSeconds)+'s';
    $('footerVersion').textContent=data.dashboardVersion+' · '+data.pipelineVersion;

    if(isPortfolio){
      $('topProductsLabel').textContent='TOP PRODUCTS';
      $('topProductsTitle').textContent='Relative performance';
      $('topProductsNote').textContent='Anonymized ranking · relative index';
    }else{
      $('topProductsLabel').textContent='TOP PRODUCTS';
      $('topProductsTitle').textContent='By revenue';
      $('topProductsNote').textContent='REAL data';
    }

    renderProducts(data.topProducts,isPortfolio);
    renderChart('chart',data.salesPerformance.current,data.salesPerformance.previous,isPortfolio);
    renderSalesView(data,isPortfolio);
    renderProductsView(data.productsView,isPortfolio,data.range);
    renderInventoryView(data.inventoryView,isPortfolio);
    renderOperationsDetailView(data.operationsView,isPortfolio,data.range);
  }

  function renderTarget(target,isPortfolio){
    const btn=$('editTargetBtn');
    btn.hidden=isPortfolio;

    if(target.configured){
      const progress=Math.max(0,Number(target.progress||0));
      const capped=Math.min(1,progress);
      $('targetProgress').textContent=pct(progress,0);
      $('targetHeadline').textContent=progress>=1?'Target achieved':progress>=.75?'Strong progress':progress>=.5?'Good progress':progress>=.25?'Building momentum':'Getting started';

      if(isPortfolio){
        $('targetDetail').textContent=target.monthLabel+' · '+Math.round(progress*100)+'% of monthly target';
        $('targetCurrent').textContent='Private';
        $('targetGoal').textContent='Private';
        $('targetRemaining').textContent='Private';
      }else{
        $('targetDetail').textContent=target.monthLabel+' · '+money(target.actual)+' de '+money(target.target);
        $('targetCurrent').textContent=money(target.actual);
        $('targetGoal').textContent=money(target.target);
        $('targetRemaining').textContent=money(target.remaining||0);
        btn.textContent='Editar meta';
      }

      $('targetBar').style.width=(capped*100)+'%';
      $('targetCompletion').textContent=Math.round(progress*100)+'% completed';
      $('targetRing').style.setProperty('--progress',(capped*360)+'deg');
    }else{
      $('targetProgress').textContent='—';
      $('targetHeadline').textContent='Meta no configurada';
      $('targetDetail').textContent=isPortfolio
        ? 'Monthly target is not configured in the private workspace.'
        : 'Configura la meta mensual para medir el progreso comercial.';
      $('targetCurrent').textContent=isPortfolio?'Private':money(target.actual);
      $('targetGoal').textContent='—';
      $('targetRemaining').textContent='—';
      $('targetBar').style.width='0%';
      $('targetCompletion').textContent=isPortfolio?'No target available':'Set a target to track progress';
      $('targetRing').style.setProperty('--progress','0deg');
      btn.textContent='Configurar meta';
    }
  }

  function renderOperations(ops,isPortfolio){
    if(isPortfolio){
      $('pending').textContent='••';
      $('cancellations').textContent='••';
      $('refunded').textContent='••';
      $('lowStock').textContent='••';
      $('outStock').textContent='••';
      $('pendingNote').textContent='Current snapshot hidden';
      $('cancellationsDelta').textContent=signedPercent(ops.cancellationsDelta);
      $('refundedDelta').textContent=signedPercent(ops.refundedDelta);
      $('lowStockNote').innerHTML='<span id="outStock">••</span> out of stock · snapshot hidden';
      return;
    }

    $('pending').textContent=num(ops.pendingFulfillment);
    $('cancellations').textContent=num(ops.cancellations);
    $('refunded').textContent=num(ops.refundedOrders);
    $('lowStock').textContent=num(ops.lowStock);
    $('outStock').textContent=num(ops.outOfStock);
    $('pendingNote').textContent='Current snapshot';
    $('cancellationsDelta').textContent=signedCount(ops.cancellations,ops.cancellationsPrevious);
    $('refundedDelta').textContent=signedCount(ops.refundedOrders,ops.refundedOrdersPrevious);
    $('lowStockNote').innerHTML='<span id="outStock">'+num(ops.outOfStock)+'</span> out of stock · snapshot';
  }

  function renderProducts(rows,isPortfolio){
    const el=$('topProductsList');
    el.innerHTML='';
    if(!rows || !rows.length){ el.innerHTML='<div class="chart-empty">Sin datos para este periodo</div>'; return; }

    if(isPortfolio){
      rows.forEach((r,i)=>{
        const index=Math.max(0,Math.min(100,Number(r.index||0)));
        const row=document.createElement('div'); row.className='product-row';
        row.innerHTML='<div class="rank">'+String(i+1).padStart(2,'0')+'</div><div class="product-name"></div><div class="product-meta"><strong>Index '+Math.round(index)+'</strong><small>relative</small></div><div class="product-bar"><i style="width:'+Math.max(2,index)+'%"></i></div>';
        const name=row.querySelector('.product-name'); name.textContent=r.name; name.title=r.name;
        el.appendChild(row);
      });
      return;
    }

    const max=Math.max(...rows.map(r=>Number(r.revenue||0)),1);
    rows.forEach((r,i)=>{
      const row=document.createElement('div'); row.className='product-row';
      row.innerHTML='<div class="rank">'+String(i+1).padStart(2,'0')+'</div><div class="product-name"></div><div class="product-meta"><strong>'+money(r.revenue)+'</strong><small>'+num(r.units)+' units</small></div><div class="product-bar"><i style="width:'+Math.max(2,(Number(r.revenue||0)/max)*100)+'%"></i></div>';
      const name=row.querySelector('.product-name'); name.textContent=r.name; name.title=r.name;
      el.appendChild(row);
    });
  }


  function maxIndex(values){
    if(!values || !values.length)return -1;
    let best=0;
    for(let i=1;i<values.length;i++){
      if(Number(values[i]||0)>Number(values[best]||0))best=i;
    }
    return best;
  }

  function renderSalesView(data,isPortfolio){
    const current=(data.salesPerformance && data.salesPerformance.current)||[];
    const previous=(data.salesPerformance && data.salesPerformance.previous)||[];
    const net=data.kpis.netSales;
    const orders=data.kpis.orders;
    const aov=data.kpis.aov;
    const target=data.target||{};

    $('salesPeriodValue').textContent=isPortfolio?net.display:money(net.value);
    $('salesPeriodDelta').textContent=signedPercent(net.delta);
    $('salesOrdersValue').textContent=isPortfolio?orders.display:num(orders.value);
    $('salesOrdersDelta').textContent=signedPercent(orders.delta);
    $('salesAovValue').textContent=isPortfolio?aov.display:money(aov.value);
    $('salesAovDelta').textContent=signedPercent(aov.delta);

    if(target.configured){
      const progress=Math.max(0,Number(target.progress||0));
      $('salesTargetValue').textContent=pct(progress,0);
      $('salesTargetNote').textContent=progress>=1?'Target achieved':target.monthLabel;
      $('salesTargetBar').style.width=Math.min(100,progress*100)+'%';
      $('salesCompareTarget').textContent=pct(progress,0);
    }else{
      $('salesTargetValue').textContent='—';
      $('salesTargetNote').textContent='Not configured';
      $('salesTargetBar').style.width='0%';
      $('salesCompareTarget').textContent='—';
    }

    $('salesRangeLabel').textContent=data.range.label;
    $('salesRangeDates').textContent=fullDateRange(data.range.start,data.range.end)+(isPortfolio?' · relative trend':'');
    $('salesCompareCurrent').textContent=isPortfolio?'•••••':money(net.value);
    $('salesComparePrevious').textContent=isPortfolio?'•••••':money(net.previous);
    $('salesCompareChange').textContent=signedPercent(net.delta);
    $('salesCompareBadge').textContent=net.delta===null || net.delta===undefined || !isFinite(net.delta)
      ? 'No comparison'
      : (net.delta>=0?'+':'')+(Number(net.delta)*100).toFixed(1)+'%';

    renderChart('salesDeepChart',current,previous,isPortfolio);

    const salesValues=current.map(r=>Number(r[isPortfolio?'index':'netSales']||0));
    const salesIdx=maxIndex(salesValues);
    if(salesIdx>=0){
      $('bestSalesDay').textContent=labelDate(current[salesIdx].date);
      $('bestSalesDayNote').textContent=isPortfolio?'Strongest relative sales day':money(current[salesIdx].netSales);
    }else{
      $('bestSalesDay').textContent='—';
      $('bestSalesDayNote').textContent='No data';
    }

    const orderValues=isPortfolio
      ? ((data.kpis.orders && data.kpis.orders.sparkline)||[])
      : current.map(r=>Number(r.orders||0));
    const ordersIdx=maxIndex(orderValues);
    if(ordersIdx>=0 && current[ordersIdx]){
      $('bestOrdersDay').textContent=labelDate(current[ordersIdx].date);
      $('bestOrdersDayNote').textContent=isPortfolio?'Highest relative order activity':num(current[ordersIdx].orders)+' orders';
    }else{
      $('bestOrdersDay').textContent='—';
      $('bestOrdersDayNote').textContent='No data';
    }

    const conversionValues=isPortfolio
      ? ((data.kpis.conversion && data.kpis.conversion.sparkline)||[])
      : current.map(r=>Number(r.conversion||0));
    const conversionIdx=maxIndex(conversionValues);
    if(conversionIdx>=0 && current[conversionIdx]){
      $('bestConversionDay').textContent=labelDate(current[conversionIdx].date);
      $('bestConversionDayNote').textContent=isPortfolio?'Strongest relative conversion day':pct(current[conversionIdx].conversion,2);
    }else{
      $('bestConversionDay').textContent='—';
      $('bestConversionDayNote').textContent='No data';
    }

    renderSalesRhythm(current,isPortfolio);
  }

  function renderSalesRhythm(current,isPortfolio){
    const el=$('salesRhythm');
    el.innerHTML='';
    if(!current || !current.length){
      el.innerHTML='<div class="chart-empty">Sin datos para este periodo</div>';
      $('salesRhythmNote').textContent='—';
      return;
    }

    const rows=current.slice(-10);
    const field=isPortfolio?'index':'netSales';
    const max=Math.max(...rows.map(r=>Number(r[field]||0)),1);
    $('salesRhythmNote').textContent=rows.length+' latest '+(rows.length===1?'day':'days');

    rows.forEach(r=>{
      const value=Number(r[field]||0);
      const width=Math.max(2,(value/max)*100);
      const row=document.createElement('div');
      row.className='rhythm-row';
      row.innerHTML='<span class="rhythm-date"></span><div class="rhythm-track"><i style="width:'+width+'%"></i></div><strong class="rhythm-value"></strong>';
      row.querySelector('.rhythm-date').textContent=labelDate(r.date);
      row.querySelector('.rhythm-value').textContent=isPortfolio?'••••':money(r.netSales);
      el.appendChild(row);
    });
  }

  function renderProductsView(view,isPortfolio,range){
    view=view||{catalog:{},topProducts:[],topTypes:[]};
    const catalog=view.catalog||{};
    $('productActiveProducts').textContent=isPortfolio?catalog.productsDisplay:num(catalog.activeProducts);
    $('productActiveVariants').textContent=isPortfolio?catalog.variantsDisplay:num(catalog.activeVariants);
    $('productTypeCount').textContent=isPortfolio?catalog.typesDisplay:num(catalog.typeCount);
    $('productLeadingType').textContent=view.leadingType||'—';
    $('productLeadingTypeNote').textContent=range?range.label:'Selected period';
    $('productTypesPeriodNote').textContent=range?range.label:'Selected period';

    $('productTypeCountLabel').textContent=isPortfolio?'PRODUCT GROUPS':'PRODUCT TYPES';
    $('productLeadingTypeLabel').textContent=isPortfolio?'LEADING PRODUCT':'LEADING TYPE';
    $('productTypePerformanceLabel').textContent=isPortfolio?'PRODUCT PERFORMANCE':'PRODUCT TYPE PERFORMANCE';
    $('productStrongestTypeLabel').textContent=isPortfolio?'STRONGEST PRODUCT':'STRONGEST TYPE';
    $('productImprovingNote').textContent=isPortfolio?'Anonymized products trending up':'Product types trending up';
    $('productAttentionNote').textContent=isPortfolio?'Anonymized products trending down':'Product types trending down';
    $('inventoryAttentionLabel').textContent=isPortfolio?'ATTENTION BY PRODUCT':'ATTENTION BY PRODUCT TYPE';

    const ranking=$('productsViewRanking'); ranking.innerHTML='';
    const rankingRows=isPortfolio?(view.topTypes||[]):(view.topProducts||[]);
    $('productsRankingTitle').textContent='Top products';
    $('productsRankingNote').textContent=isPortfolio?'Anonymized ranking · relative index':'By revenue';
    if(!rankingRows.length){ ranking.innerHTML='<div class="chart-empty">Sin datos para este periodo</div>'; }
    else{
      const maxReal=isPortfolio?100:Math.max(...rankingRows.map(r=>Number(r.revenue||0)),1);
      rankingRows.forEach((r,i)=>{
        const width=isPortfolio?Math.max(2,Number(r.index||0)):Math.max(2,(Number(r.revenue||0)/maxReal)*100);
        const row=document.createElement('div'); row.className='rank-row';
        row.innerHTML='<span class="rank-no">'+String(i+1).padStart(2,'0')+'</span><div class="rank-copy"><strong></strong><small></small><div class="rank-track"><i style="width:'+width+'%"></i></div></div><span class="rank-value"></span>';
        row.querySelector('.rank-copy strong').textContent=r.name||'—';
        row.querySelector('.rank-copy small').textContent=isPortfolio?(r.trend||'Relative performance'):(num(r.units)+' units');
        row.querySelector('.rank-value').textContent=isPortfolio?'••••':money(r.revenue);
        ranking.appendChild(row);
      });
    }

    const typeList=$('productTypesPerformance'); typeList.innerHTML='';
    const typeRows=view.topTypes||[];
    if(!typeRows.length){ typeList.innerHTML='<div class="chart-empty">Sin datos para este periodo</div>'; }
    else typeRows.forEach(r=>{
      const idx=Math.max(0,Math.min(100,Number(r.index||0)));
      const row=document.createElement('div'); row.className='signal-row';
      row.innerHTML='<div class="signal-top"><strong></strong><span></span></div><div class="signal-track"><i style="width:'+Math.max(2,idx)+'%"></i></div><small></small>';
      row.querySelector('strong').textContent=r.name||'—';
      row.querySelector('.signal-top span').textContent=isPortfolio?'••••':money(r.revenue);
      row.querySelector('small').textContent=isPortfolio?(r.trend||'Stable'):signedPercent(r.delta);
      typeList.appendChild(row);
    });

    if(typeRows.length){
      $('productStrongestType').textContent=typeRows[0].name||'—';
      $('productStrongestTypeNote').textContent=isPortfolio?'Highest relative product signal':money(typeRows[0].revenue||0)+' in period';
    }else{
      $('productStrongestType').textContent='—'; $('productStrongestTypeNote').textContent='No data';
    }
    if(isPortfolio){
      $('productImprovingCount').textContent='••';
      $('productAttentionCount').textContent='••';
    }else{
      $('productImprovingCount').textContent=num(typeRows.filter(r=>Number(r.delta||0)>.05).length);
      $('productAttentionCount').textContent=num(typeRows.filter(r=>Number(r.delta||0)<-.05).length);
    }
  }

  function renderInventoryView(view,isPortfolio){
    view=view||{summary:{},stockMix:[],attentionTypes:[]};
    const s=view.summary||{};
    $('inventoryVariants').textContent=isPortfolio?s.variantsDisplay:num(s.activeVariants);
    $('inventoryAvailable').textContent=isPortfolio?s.availableDisplay:num(s.availableUnits);
    $('inventoryCommitted').textContent=isPortfolio?s.committedDisplay:num(s.committedUnits);
    $('inventoryHealth').textContent=s.healthLabel||'—';
    $('inventoryHealthNote').textContent=isPortfolio?'Sanitized stock-health signal':(pct(s.healthRate||0,0)+' healthy variants');
    $('inventoryMixNote').textContent=isPortfolio?'Relative mix · values hidden':'Current snapshot';

    const mixEl=$('inventoryStockMix'); mixEl.innerHTML='';
    const mix=view.stockMix||[];
    const totalReal=isPortfolio?0:mix.reduce((a,r)=>a+Number(r.count||0),0);
    if(!mix.length){ mixEl.innerHTML='<div class="chart-empty">Sin datos de inventario</div>'; }
    else mix.forEach(r=>{
      const index=isPortfolio?Number(r.index||0):(totalReal?Number(r.count||0)/totalReal*100:0);
      const row=document.createElement('div'); row.className='signal-row';
      row.innerHTML='<div class="signal-top"><strong></strong><span></span></div><div class="signal-track"><i style="width:'+Math.max(2,Math.min(100,index))+'%"></i></div><small></small>';
      row.querySelector('strong').textContent=r.name;
      row.querySelector('.signal-top span').textContent=isPortfolio?'••••':num(r.count);
      row.querySelector('small').textContent=isPortfolio?'Relative stock mix':(totalReal?Math.round(Number(r.count||0)/totalReal*100)+'% of variants':'—');
      mixEl.appendChild(row);
    });

    const att=$('inventoryAttentionTypes'); att.innerHTML='';
    const attention=view.attentionTypes||[];
    if(!attention.length){ att.innerHTML='<div class="chart-empty">No attention signals</div>'; }
    else attention.forEach((r,i)=>{
      const row=document.createElement('div'); row.className='rank-row';
      row.innerHTML='<span class="rank-no">'+String(i+1).padStart(2,'0')+'</span><div class="rank-copy"><strong></strong><small></small><div class="rank-track"><i style="width:'+Math.max(2,Math.min(100,Number(r.index||0)))+'%"></i></div></div><span class="rank-value"></span>';
      row.querySelector('.rank-copy strong').textContent=r.name||'—';
      row.querySelector('.rank-copy small').textContent=isPortfolio?(r.status||'Watch'):(num(r.lowStock)+' low · '+num(r.outOfStock)+' out');
      row.querySelector('.rank-value').textContent=isPortfolio?'••••':num(r.attentionScore);
      att.appendChild(row);
    });

    if(isPortfolio){
      $('inventoryLowStock').textContent=s.lowStockDisplay||'••';
      $('inventoryOutStock').textContent=s.outOfStockDisplay||'••';
      $('inventoryOnHand').textContent='•••••';
      $('inventoryThreshold').textContent='••';
      $('inventoryScopeNote').textContent='Private inventory scope';
    }else{
      $('inventoryLowStock').textContent=num(s.lowStock);
      $('inventoryOutStock').textContent=num(s.outOfStock);
      $('inventoryOnHand').textContent=num(s.onHandUnits);
      $('inventoryThreshold').textContent=num(view.threshold);
      $('inventoryScopeNote').textContent=view.scopeLabel||'Inventory scope';
    }
  }

  function renderOperationsDetailView(view,isPortfolio,range){
    view=view||{summary:{},pipeline:[],dailyExceptions:[],currentSnapshot:{}};
    const s=view.summary||{};
    $('operationsOrders').textContent=isPortfolio?s.ordersDisplay:num(s.totalOrders);
    $('operationsFulfilled').textContent=isPortfolio?s.fulfilledDisplay:num(s.fulfilled);
    $('operationsPending').textContent=isPortfolio?s.pendingDisplay:num(s.pending);
    $('operationsHealth').textContent=s.fulfillmentHealth||'—';
    $('operationsHealthNote').textContent=isPortfolio?'Sanitized fulfillment signal':pct(s.fulfillmentRate||0,0)+' fulfilled';
    $('operationsPeriodNote').textContent=range?range.label:'Selected period';

    const pipeline=$('operationsPipeline'); pipeline.innerHTML='';
    const rows=view.pipeline||[];
    const maxReal=isPortfolio?100:Math.max(...rows.map(r=>Number(r.count||0)),1);
    if(!rows.length){ pipeline.innerHTML='<div class="chart-empty">Sin datos para este periodo</div>'; }
    else rows.forEach(r=>{
      const width=isPortfolio?Number(r.index||0):Number(r.count||0)/maxReal*100;
      const row=document.createElement('div'); row.className='signal-row';
      row.innerHTML='<div class="signal-top"><strong></strong><span></span></div><div class="signal-track"><i style="width:'+Math.max(2,Math.min(100,width))+'%"></i></div><small></small>';
      row.querySelector('strong').textContent=r.name;
      row.querySelector('.signal-top span').textContent=isPortfolio?'••••':num(r.count);
      row.querySelector('small').textContent=isPortfolio?'Relative pipeline signal':'Orders in selected period';
      pipeline.appendChild(row);
    });

    $('operationsCancellations').textContent=isPortfolio?s.cancellationsDisplay:num(s.cancelled);
    $('operationsRefunds').textContent=isPortfolio?s.refundsDisplay:num(s.refunded);
    $('operationsCancellationTrend').textContent=isPortfolio?(s.cancellationTrend||'—'):signedPercent(s.cancellationsDelta);
    $('operationsRefundTrend').textContent=isPortfolio?(s.refundTrend||'—'):signedPercent(s.refundedDelta);

    const exceptions=$('operationsExceptions'); exceptions.innerHTML='';
    const days=(view.dailyExceptions||[]).slice(-10);
    if(!days.length){ exceptions.innerHTML='<div class="chart-empty">No exception activity in this period</div>'; }
    else{
      const maxException=isPortfolio?100:Math.max(...days.map(r=>Number(r.cancellations||0)+Number(r.refunds||0)),1);
      days.forEach(r=>{
        const raw=isPortfolio?Number(r.index||0):Number(r.cancellations||0)+Number(r.refunds||0);
        const width=isPortfolio?raw:(raw/maxException*100);
        const row=document.createElement('div'); row.className='exception-row';
        row.innerHTML='<span></span><div class="exception-track"><i style="width:'+Math.max(2,Math.min(100,width))+'%"></i></div><strong></strong>';
        row.querySelector('span').textContent=labelDate(r.date);
        row.querySelector('strong').textContent=isPortfolio?'••••':num(raw);
        exceptions.appendChild(row);
      });
    }

    const snap=view.currentSnapshot||{};
    if(isPortfolio){
      $('operationsSnapshotPending').textContent='••';
      $('operationsSnapshotLow').textContent='••';
      $('operationsSnapshotOut').textContent='••';
    }else{
      $('operationsSnapshotPending').textContent=num(snap.pendingFulfillment);
      $('operationsSnapshotLow').textContent=num(snap.lowStock);
      $('operationsSnapshotOut').textContent=num(snap.outOfStock);
    }
  }

  function renderSparkline(id,values){
    const el=$(id); el.innerHTML='';
    if(!values || values.length<2)return;
    const W=96,H=50,p=3;
    const vals=values.map(v=>Number(v||0));
    let min=Math.min(...vals),max=Math.max(...vals); if(max===min){max=min+1;}
    const x=i=>p+i/(vals.length-1)*(W-p*2);
    const y=v=>p+(max-v)/(max-min)*(H-p*2);
    const d=vals.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
    el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" aria-hidden="true"><path d="'+d+'" fill="none" stroke="#0b0b0b" stroke-width="1.8" vector-effect="non-scaling-stroke"/></svg>';
  }

  function renderChart(containerId,current,previous,isPortfolio){
    const el=$(containerId); el.innerHTML='';
    if(!current || !current.length){ el.innerHTML='<div class="chart-empty">Sin datos para este periodo</div>'; return; }

    const field=isPortfolio?'index':'netSales';
    const W=900,H=250,pad={l:isPortfolio?44:50,r:10,t:14,b:30};
    const currentVals=current.map(x=>Number(x[field]||0));
    const previousVals=(previous||[]).map(x=>Number(x[field]||0));
    const vals=currentVals.concat(previousVals);
    let min,max;

    if(isPortfolio){
      min=0; max=100;
    }else{
      min=Math.min(0,...vals); max=Math.max(0,...vals); if(max===min)max=min+1;
      const span=max-min;
      max+=span*.08; min-=span*.03;
    }

    const x=(i,n)=>pad.l+(n<=1?0:i/(n-1))*(W-pad.l-pad.r);
    const y=v=>pad.t+(max-Number(v))/(max-min)*(H-pad.t-pad.b);
    const path=(arr)=>arr.map((p,i)=>(i?'L':'M')+x(i,arr.length).toFixed(1)+' '+y(p[field]).toFixed(1)).join(' ');
    const svgNS='http://www.w3.org/2000/svg';
    const svg=document.createElementNS(svgNS,'svg'); svg.setAttribute('viewBox','0 0 '+W+' '+H);

    for(let g=0;g<=4;g++){
      const value=max-(max-min)*(g/4);
      const yy=y(value);
      const line=document.createElementNS(svgNS,'line');line.setAttribute('x1',pad.l);line.setAttribute('x2',W-pad.r);line.setAttribute('y1',yy);line.setAttribute('y2',yy);line.setAttribute('class',Math.abs(value)<(max-min)/100?'zero-line':'grid-line');svg.appendChild(line);
      const t=document.createElementNS(svgNS,'text');
      t.setAttribute('x',pad.l-8);
      t.setAttribute('y',yy+3);
      t.setAttribute('text-anchor','end');
      t.setAttribute('class','axis-label');
      t.textContent=isPortfolio?'****':compactMoney(value);
      svg.appendChild(t);
    }

    if(previous && previous.length){
      const p=document.createElementNS(svgNS,'path');p.setAttribute('d',path(previous));p.setAttribute('fill','none');p.setAttribute('stroke','#8f8f8b');p.setAttribute('stroke-width','1.8');p.setAttribute('stroke-dasharray','6 6');p.setAttribute('vector-effect','non-scaling-stroke');svg.appendChild(p);
    }
    const c=document.createElementNS(svgNS,'path');c.setAttribute('d',path(current));c.setAttribute('fill','none');c.setAttribute('stroke','#0b0b0b');c.setAttribute('stroke-width','2.2');c.setAttribute('vector-effect','non-scaling-stroke');svg.appendChild(c);

    [0,Math.floor((current.length-1)/2),current.length-1].filter((v,i,a)=>a.indexOf(v)===i).forEach(i=>{
      const t=document.createElementNS(svgNS,'text');t.setAttribute('x',x(i,current.length));t.setAttribute('y',H-7);t.setAttribute('text-anchor',i===0?'start':i===current.length-1?'end':'middle');t.setAttribute('class','axis-label');t.textContent=labelDate(current[i].date);svg.appendChild(t);
    });

    if(!isPortfolio){
      const hover=document.createElementNS(svgNS,'rect');hover.setAttribute('x',pad.l);hover.setAttribute('y',pad.t);hover.setAttribute('width',W-pad.l-pad.r);hover.setAttribute('height',H-pad.t-pad.b);hover.setAttribute('fill','transparent');hover.style.cursor='crosshair';svg.appendChild(hover);
      const guide=document.createElementNS(svgNS,'line');guide.setAttribute('y1',pad.t);guide.setAttribute('y2',H-pad.b);guide.setAttribute('stroke','#777');guide.setAttribute('stroke-width','1');guide.setAttribute('stroke-dasharray','2 3');guide.setAttribute('visibility','hidden');svg.appendChild(guide);
      const dot=document.createElementNS(svgNS,'circle');dot.setAttribute('r','3.5');dot.setAttribute('fill','#0b0b0b');dot.setAttribute('visibility','hidden');svg.appendChild(dot);

      hover.addEventListener('mousemove',function(evt){
        const rect=svg.getBoundingClientRect();
        const px=(evt.clientX-rect.left)/rect.width*W;
        const idx=Math.max(0,Math.min(current.length-1,Math.round((px-pad.l)/(W-pad.l-pad.r)*(current.length-1))));
        const xx=x(idx,current.length),yy=y(current[idx][field]);
        guide.setAttribute('x1',xx);guide.setAttribute('x2',xx);guide.setAttribute('visibility','visible');
        dot.setAttribute('cx',xx);dot.setAttribute('cy',yy);dot.setAttribute('visibility','visible');
        const prev=previous && previous[idx] ? previous[idx] : null;
        const tip=$('chartTooltip');
        tip.innerHTML='<strong>'+labelDate(current[idx].date)+'</strong><span>This period: '+money(current[idx].netSales)+'</span>'+(prev?'<span>Previous: '+money(prev.netSales)+'</span>':'');
        tip.hidden=false;
        tip.style.left=Math.min(window.innerWidth-175,evt.clientX+14)+'px';
        tip.style.top=Math.max(10,evt.clientY-25)+'px';
      });
      hover.addEventListener('mouseleave',function(){ guide.setAttribute('visibility','hidden');dot.setAttribute('visibility','hidden');$('chartTooltip').hidden=true; });
    }

    el.appendChild(svg);
  }


  function setView(view){
    const allowed=['overview','sales','products','inventory','operations'];
    if(allowed.indexOf(view)<0)view='overview';
    const changed=state.view!==view;
    state.view=view;
    setViewUi();
    $('mainContent').scrollTo({top:0,behavior:'smooth'});
    if(changed) sendAnalyticsEvent('section_view',{section_name:view});
  }

  const viewBindings={
    overview:['navOverview','mobileNavOverview'],
    sales:['navSales','mobileNavSales'],
    products:['navProducts','mobileNavProducts'],
    inventory:['navInventory','mobileNavInventory'],
    operations:['navOperations','mobileNavOperations']
  };
  Object.keys(viewBindings).forEach(view=>viewBindings[view].forEach(id=>{ const btn=$(id); if(btn) btn.addEventListener('click',()=>setView(view)); }));

  $('rangeSelect').addEventListener('change',e=>{
    const range=String(e.target.value||'');
    if(analyticsRanges.indexOf(range)<0)return;
    state.range=range;
    sendAnalyticsEvent('range_change',{range_name:range});
    load();
  });

  function setMode(){ /* Public app is permanently locked to Portfolio Mode. */ }
  $('retryBtn').addEventListener('click',()=>load());

  $('editTargetBtn').addEventListener('click',function(){
    if(state.mode!=='real')return;
    const current=state.data && state.data.target && state.data.target.configured ? Math.round(state.data.target.target) : '';
    const raw=window.prompt('Meta mensual en MXN. Escribe 0 para quitarla.',current);
    if(raw===null)return;
    const value=Number(String(raw).replace(/[$,\s]/g,''));
    if(!isFinite(value)||value<0){showError('Escribe una meta válida en MXN.');return;}
    setLoading(true);
    google.script.run
      .withSuccessHandler(()=>load())
      .withFailureHandler(err=>{setLoading(false);showError(err && err.message ? err.message : String(err));})
      .setCommandCenterMonthlyTarget(value);
  });

  initializeAnalytics();
  setModeUi();
  load();
})();
</script>
